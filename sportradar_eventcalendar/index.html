<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
 </head>
 <body>
    <div id="toastContainer" class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" aria-live="polite" aria-atomic="true"></div>

    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Please confirm</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p id="confirmMessage">Do you really want to delete the event?</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirmOkBtn">Yes, continue</button>
          </div>
        </div>
      </div>
    </div>
    <nav class="navbar navbar-expand-lg navbar-dark bg-blue navbar-animate">
        <div class="container">
            <a class="navbar-brand" href="#">Sports Calendar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" aria-current="page">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#events">Events</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="offcanvas" href="#addEventOffcanvas" role="button" aria-controls="addEventOffcanvas">Add Event</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <header class="container text-start mb-4">
        <img src="https://sportradar.com/wp-content/uploads/2021/11/SR-Logo.jpg" class="img-fluid rounded brand-img" alt="Sportradar logo" loading="lazy">
    </header>

    <div class="container">
        <div class="row g-4">
            <div class="col-lg-12">
                <section id="events" class="filters">
                    <h2>Events</h2>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="filter-sport" class="form-label">Filter by Sport</label>
                            <select class="form-select" id="filter-sport">
                                <option value="">All Sports</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="filter-date" class="form-label">Filter by Date</label>
                            <input type="date" class="form-control" id="filter-date">
                        </div>
                        <div class="col-md-4 mb-3 d-flex align-items-end">
                            <button id="clear-filters" class="btn btn-secondary w-100">Clear Filters</button>
                        </div>
                    </div>
                </section>

                <div id="events-container" class="row">
                    <div class="col-12 text-center">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p>Loading events...</p>
                    </div>
                </div>
            </div>
            
            <div class="offcanvas offcanvas-end" tabindex="-1" id="addEventOffcanvas" aria-labelledby="addEventOffcanvasLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="addEventOffcanvasLabel">Add New Event</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <section id="add-event" class="form-container">
                        <form id="event-form">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="event-date" class="form-label">Date</label>
                                    <input type="date" class="form-control" id="event-date" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="event-time" class="form-label">Time</label>
                                    <input type="time" class="form-control" id="event-time" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="sport-select" class="form-label">Sport</label>
                                    <select class="form-select" id="sport-select" required>
                                        <option value="">Select Sport</option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="home-team-select" class="form-label">Home Team</label>
                                    <select class="form-select" id="home-team-select" required>
                                        <option value="">Select Home Team</option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="away-team-select" class="form-label">Away Team</label>
                                    <select class="form-select" id="away-team-select" required>
                                        <option value="">Select Away Team</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="venue-select" class="form-label">Venue</label>
                                <select class="form-select" id="venue-select" required>
                                    <option value="">Select Venue</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="event-description" class="form-label">Description</label>
                                <textarea class="form-control" id="event-description" rows="3"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Add Event</button>
                        </form>
                    </section>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
